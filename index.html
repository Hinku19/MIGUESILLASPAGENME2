<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YA PAGARON</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #8fd18a;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2a1c;
            text-align: center;
        }
 
        .contenedor {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #f3fbef;
            border: 4px solid #1f2a1c;
            border-radius: 8px;
            padding: 30px 25px;
        }
 
        h1 {
            font-size: 2.4rem;
            color: #1e7a2e;
            margin: 0 0 15px;
        }
 
        h3 {
            font-size: 1.4rem;
            margin: 0 0 10px;
        }
 
        p {
            font-size: 1.1rem;
            margin: 10px 0;
        }
 
        .fotos {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
        }
 
        .foto {
            position: relative;
            width: 30%;
        }
 
        .foto img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border: 4px solid #1f2a1c;
            border-radius: 6px;
            display: block;
        }
 
        /* Sello de PAGADO encima de cada foto */
        .foto span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 4px solid #1e7a2e;
            color: #1e7a2e;
            background-color: rgba(243, 251, 239, 0.85);
            font-weight: bold;
            font-size: 1.6rem;
            padding: 6px 14px;
            border-radius: 6px;
        }
 
        .chisme {
            background-color: #fff3c4;
            border: 3px dashed #1f2a1c;
            border-radius: 6px;
            padding: 15px;
            font-size: 1.2rem;
            margin-top: 25px;
        }
 
        @media (max-width: 600px) {
            h1 { font-size: 1.7rem; }
            .fotos { flex-direction: column; align-items: center; }
            .foto { width: 90%; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>YA PAGARON TODOS :D</h1>
        <h3>El Sillas y el Migue ya están al corriente con su camisa</h3>
        <p>Gracias por su pago jotos</p>
 
        <div class="fotos">
            <div class="foto">
                <img src="migue.jpeg" alt="Miguel">
                <span>PAGADO*</span>
            </div>
            <div class="foto">
                <img src="sillas1.jpeg" alt="Sillas">
                <span>PAGADO</span>
            </div>
            <div class="foto">
                <img src="sillas2.jpeg" alt="Sillas otra vez">
                <span>PAGADO</span>
            </div>
        </div>
 
        <p class="chisme">* Aclaración: la camisa del Miguel la pagó el Martín. Che jodido jajaja</p>
 
        <p>Ya no les tiren con las tortas paro</p>
    </div>
</body>
</html>
